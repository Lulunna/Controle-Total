<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B0F20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="standalone.js"></script>
<title>Controle Total</title>
<script>document.documentElement.lang="pt-BR"</script>
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF4F0; --surface:#FFFFFF; --surface2:#F5E9E6; --ink:#2B1631; --muted:#7D6584; --line:#EBDAD8;
  --plum:#5B2A63; --plum-soft:#EBDDEE; --on-plum:#FFF6F1;
  --peach:#FF9B76; --peach-soft:#FFE9DE; --on-peach:#3A1530;
  --ok:#2F8F6B; --warn:#E8A33A; --danger:#D6475F;
  --c-comida:#FF9B76; --c-mercado:#E2B93B; --c-transporte:#6E8BD9; --c-lazer:#B067C9;
  --c-estudos:#3FA7A0; --c-saude:#E3607E; --c-casa:#8A7BD1; --c-contas:#5E8FB8; --c-outros:#A89AAE;
  --shadow:0 6px 24px rgba(91,42,99,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B0F20; --surface:#271731; --surface2:#33203F; --ink:#F7EAF0; --muted:#B79DBE; --line:#3D2A49;
    --plum:#D3A0DD; --plum-soft:#3D2548; --on-plum:#2B1631;
    --peach:#FFA98A; --peach-soft:#3F2630; --on-peach:#2B1220;
    --ok:#5CC49C; --warn:#F2B04A; --danger:#FF6F86;
    --c-comida:#FFA98A; --c-mercado:#E9C85A; --c-transporte:#86A2F0; --c-lazer:#C98BE0;
    --c-estudos:#56C2BA; --c-saude:#FF86A0; --c-casa:#A596E8; --c-contas:#86B4DA; --c-outros:#B9ABC0;
    --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B0F20; --surface:#271731; --surface2:#33203F; --ink:#F7EAF0; --muted:#B79DBE; --line:#3D2A49;
  --plum:#D3A0DD; --plum-soft:#3D2548; --on-plum:#2B1631;
  --peach:#FFA98A; --peach-soft:#3F2630; --on-peach:#2B1220;
  --ok:#5CC49C; --warn:#F2B04A; --danger:#FF6F86;
  --c-comida:#FFA98A; --c-mercado:#E9C85A; --c-transporte:#86A2F0; --c-lazer:#C98BE0;
  --c-estudos:#56C2BA; --c-saude:#FF86A0; --c-casa:#A596E8; --c-contas:#86B4DA; --c-outros:#B9ABC0;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3,.big{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px;display:flex;align-items:center;gap:11px}
.top svg.lg{width:38px;height:38px;flex:none}
.hello small{display:block;color:var(--muted);font-size:12.5px;line-height:1.1}
.hello b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;color:var(--plum);line-height:1.15}
.mpill{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 14px 9px 16px;font-weight:700;text-transform:capitalize}
.mpill svg{color:var(--plum)}
.dpill{margin-left:auto;color:var(--muted);font-size:13px;font-weight:700;text-align:right;line-height:1.2}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
h3{font-size:17px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px -6px}
.sec h3{margin:0}
.sec button{color:var(--plum);font-weight:700;font-size:13px}

/* anel do dia */
.hero{background:linear-gradient(155deg,var(--plum),color-mix(in srgb,var(--plum) 62%,var(--peach)));color:var(--on-plum);border:0;position:relative;overflow:hidden;text-align:left;padding:22px 20px 20px}
.hero::before{content:"";position:absolute;left:-60px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:var(--peach);opacity:.16}
.hero>*{position:relative;z-index:1}
.ringbox{position:relative;width:236px;height:236px;margin:2px auto 8px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .tr{fill:none;stroke:rgba(255,255,255,.18);stroke-width:16}
.ringbox .pg{fill:none;stroke:var(--peach);stroke-width:16;stroke-linecap:round;stroke-dasharray:553;stroke-dashoffset:553;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ringbox .pg.warn{stroke:var(--warn)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ringc small{font-size:13px;opacity:.85}
.ringc .big{font-size:42px;font-weight:800;line-height:1}
.ringc em{font-style:normal;font-size:13px;opacity:.85}
.mood{font-size:14.5px;margin:0 6px 12px;min-height:21px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tags span{background:rgba(255,255,255,.17);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.025)}}
.hero .cta{display:inline-block;background:var(--peach);color:var(--on-peach);border-radius:99px;padding:10px 18px;font-weight:700;margin-top:4px}

/* cofrinho */
.jar{display:flex;gap:16px;align-items:center;text-align:left;width:100%}
.jar svg{width:78px;height:94px;flex:none;overflow:visible}
.jar .tx{flex:1;min-width:0}
.jar small{color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.jar .big{font-size:24px;font-weight:800;color:var(--plum);margin:2px 0}
.jar p{margin:0;font-size:13.5px;color:var(--muted)}
.wv{animation:wave 2.6s linear infinite}
@keyframes wave{to{transform:translateX(-50px)}}

/* strip contas */
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.bc{flex:none;width:168px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:13px;display:flex;flex-direction:column;gap:3px;text-align:left}
.bc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .v{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:800;color:var(--plum)}
.bc .go{margin-top:8px;background:var(--plum);color:var(--on-plum);border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:13.5px}
.bc.late{border-color:color-mix(in srgb,var(--warn) 60%,transparent)}
.hint{color:var(--muted);font-size:14px;text-align:center;padding:14px}

.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.pill.danger{background:color-mix(in srgb,var(--danger) 15%,var(--surface));color:var(--danger)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}

.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px 14px;margin-bottom:8px}
.item:active{background:var(--surface2)}
.item .tag{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:19px;background:color-mix(in srgb,var(--cc) 22%,var(--surface))}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted)}
.item .v{font-weight:700;white-space:nowrap}
.item .v.in{color:var(--ok)}
.bill{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 14px;margin-bottom:8px}
.bill .info{flex:1;min-width:0;text-align:left}
.bill .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill .info small{color:var(--muted)}
.bill .v{font-weight:700;white-space:nowrap}
.bill.paid .info b{text-decoration:line-through;color:var(--muted)}
.check{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{text-align:center;padding:26px 18px;color:var(--muted)}
.empty b.big{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:99px;background:var(--peach);color:var(--on-peach);display:flex;align-items:center;gap:8px;font-weight:800;box-shadow:0 10px 26px rgba(255,155,118,.5);z-index:6}
.fab svg{width:24px;height:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--plum);color:var(--on-plum);border-radius:16px;padding:14px 20px;font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:none;color:var(--danger);padding:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--plum);background:var(--plum-soft)}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cd{position:relative;aspect-ratio:1/1.08;border-radius:14px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:14px;overflow:hidden}
.cd::before{content:"";position:absolute;inset:0;background:var(--peach);opacity:var(--h,0)}
.cd>*{position:relative}
.cd.today{box-shadow:inset 0 0 0 2px var(--peach)}
.cd.sel{background:var(--plum);color:var(--on-plum)}
.cd.sel::before{opacity:0}
.cd.ghost{background:none;pointer-events:none}
.cd.ghost::before{display:none}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dots .b{background:var(--plum)}.dots .g{background:var(--ok)}
.cd.sel .dots .b{background:var(--peach)}.cd.sel .dots .g{background:#9BE3C4}
.legend2{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:12px}
.legend2 span{display:flex;align-items:center;gap:6px}
.legend2 i{width:8px;height:8px;border-radius:50%}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.trio div{background:var(--surface2);border-radius:16px;padding:10px 6px}
.trio small{display:block;color:var(--muted);font-size:12px}
.trio b{font-size:15px}
.trio .in{color:var(--ok)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.dayh h3{margin:0}
.dayh h3::first-letter{text-transform:uppercase}
.dayh span{color:var(--muted);font-weight:700}

/* relatorio */
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);background:var(--surface2);border-radius:14px;padding:4px}
.seg button{padding:10px 4px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--plum);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px}
.chip.on{background:var(--plum);color:var(--on-plum);border-color:var(--plum)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c-outros)}
.delta{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.delta.up{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.delta.down{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.donut-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;flex:none;position:relative;margin:0 auto}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface)}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.donut-c b{display:block;font-size:17px;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend span{margin-left:auto;font-weight:700}
.pbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--peach)}
.pbar i.done{background:var(--ok)}
.hbar{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.hbar:last-child{margin-bottom:0}
.hbar .r{display:flex;justify-content:space-between;font-size:14px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:4px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bars .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--peach);min-height:3px}
.bars .col.zero .b{background:var(--surface2)}
.bars .col.hi .b{background:var(--plum)}
.bars small{font-size:10.5px;color:var(--muted);height:13px}
.row2{display:flex;gap:10px;align-items:center;padding:6px 0}
.row2 span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chat */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--plum);color:var(--on-plum);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.wait{color:var(--muted)}
.cbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.cbar div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.cbar input{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:12px 16px;outline:0}
.cbar input:focus{border-color:var(--peach)}
.cbar button{width:48px;height:48px;border-radius:50%;background:var(--peach);color:var(--on-peach);display:grid;place-items:center;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:8px}

/* janela de anotar */
.scrim{position:fixed;inset:0;background:rgba(30,10,36,.5);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:28px 28px 0 0;max-height:94vh;overflow:auto;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{font-size:21px}
.amt{text-align:center;font-family:"Bricolage Grotesque",sans-serif;font-size:46px;font-weight:800;color:var(--plum);line-height:1.1;padding:2px 0}
.amt.zero{color:var(--line)}
.txt{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:12px 14px;outline:0}
.txt:focus{border-color:var(--peach)}
.bub{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.bub::-webkit-scrollbar{display:none}
.bub button{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.bub button span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface2);border:3px solid transparent}
.bub button.on{color:var(--ink)}
.bub button.on span{border-color:var(--plum);background:var(--plum-soft)}
.rowf{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.datechip{position:relative;display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border-radius:14px;padding:12px 14px;font-weight:700;overflow:hidden;white-space:nowrap}
.datechip{border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}
.dpk{background:var(--surface2);border-radius:18px;padding:12px}
.dpkh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;text-transform:capitalize}
.dpkh button{width:40px;height:40px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer}
.dpkw,.dpkg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dpkw i{font-style:normal;font-size:12px;color:var(--muted);padding:4px 0}
.dpkg button{aspect-ratio:1;border:0;border-radius:12px;background:none;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;padding:0}
.dpkg button.now{box-shadow:inset 0 0 0 2px var(--peach)}
.dpkg button.on{background:var(--plum);color:var(--on-plum)}
.datechip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.datechip input.x{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0;margin:0;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:48px;border-radius:16px;background:var(--surface2);font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800}
.pad button:active{background:var(--plum-soft)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{padding:14px 0;border-radius:16px;background:var(--surface2);font-weight:700;text-transform:capitalize;position:relative}
.mgrid button.on{background:var(--plum);color:var(--on-plum)}
.mgrid button.cur{box-shadow:inset 0 0 0 2px var(--peach)}
.mgrid button i{position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--peach)}
.yr{display:flex;align-items:center;justify-content:space-between}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
"use strict";
var CATS=[
 {id:"comida",n:"Comida",e:"🍔"},{id:"mercado",n:"Mercado",e:"🛒"},{id:"transporte",n:"Transporte",e:"🚌"},{id:"lazer",n:"Lazer",e:"🎮"},
 {id:"estudos",n:"Estudos",e:"📚"},{id:"saude",n:"Saúde",e:"💊"},{id:"casa",n:"Casa",e:"🏠"},{id:"contas",n:"Contas",e:"🧾"},{id:"outros",n:"Outros",e:"✨"}
];
var KINDS=[{id:"salario",n:"Salário fixo",e:"💼"},{id:"extra",n:"Ganho extra",e:"💸"}];
var PAYS=[{id:"pix",n:"Pix"},{id:"dinheiro",n:"Dinheiro"},{id:"debito",n:"Débito"},{id:"credito",n:"Crédito"},{id:"outro",n:"Outro"}];
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var MCURTO=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
var brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function money(v){return brl.format(v)}
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function mk(y,m){return y+"-"+pad(m+1)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return arr[arr.length-1]}
function $(id){return document.getElementById(id)}
function uid(){return "g"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function daysIn(mi){return new Date(mi.y,mi.m+1,0).getDate()}
function ym(d){return d.getFullYear()*12+d.getMonth()}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}

var today=new Date();today.setHours(0,0,0,0);
var TODAY=iso(today);
var S={tx:[],bills:[],goal:{save:0}};
var ui={tab:"home",y:today.getFullYear(),m:today.getMonth(),sel:TODAY,rep:"month",filter:"all",wk:null,py:today.getFullYear(),chat:[],busy:false,anim:true};
var last={cat:"comida",pay:"pix"};
function cur(){return {y:ui.y,m:ui.m}}
function nowMi(){return {y:today.getFullYear(),m:today.getMonth()}}

/* ---------- armazenamento ---------- */
var ref=null,saveT=null,LS="controle-total-v1";
function lsGet(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
function norm(o){
  try{o=o?JSON.parse(JSON.stringify(o)):o}catch(e){}
  var d={tx:[],bills:[],goal:{save:0},u:(o&&+o.u)||0};
  if(o&&Array.isArray(o.tx))d.tx=o.tx.filter(function(t){return t&&typeof t.amount==="number"&&t.date});
  if(o&&Array.isArray(o.bills))d.bills=o.bills.filter(function(b){return b&&b.date});
  if(o&&o.goal)d.goal.save=+o.goal.save||0;
  return d;
}
function persist(){
  S.u=Date.now();lsSet(S);clearTimeout(saveT);
  saveT=setTimeout(function(){if(ref){try{ref.set(JSON.parse(JSON.stringify(S))).catch(function(){})}catch(e){}}},350);
}
async function boot(){
  var local=lsGet();
  try{
    if(window.claude&&claude.use){
      var u=await claude.use("user"),db=await claude.use("db");
      if(u&&db&&u.id){
        var id=await u.id();
        ref=db.collection("data/users/"+id).doc("controle-total");
        var snap=await ref.get();
        if(snap&&snap.exists){var rem=norm(snap.data());if(local&&(+local.u||0)>rem.u){S=norm(local);persist()}else{S=rem;lsSet(S)}return}
      }
    }
  }catch(e){}
  if(local)S=norm(local);
}

/* ---------- dados ---------- */
function monthTx(mi){
  var res=[],key=mk(mi.y,mi.m),dn=daysIn(mi);
  S.tx.forEach(function(t){
    if(t.type==="in"&&t.rec){
      var d=pd(t.date);
      if(ym(d)<=mi.y*12+mi.m)res.push(Object.assign({},t,{date:key+"-"+pad(Math.min(d.getDate(),dn))}));
    }else if(t.date.slice(0,7)===key)res.push(t);
  });
  return res;
}
function txRange(a,b){
  var da=pd(a),db=pd(b),out=[];
  for(var v=ym(da);v<=ym(db);v++)monthTx({y:Math.floor(v/12),m:v%12}).forEach(function(t){if(t.date>=a&&t.date<=b)out.push(t)});
  return out;
}
function occ(b,key,depth){
  var d=pd(b.date),cm=+key.slice(0,4)*12+(+key.slice(5,7)-1);
  if(b.rec){if(ym(d)>cm)return null;if(b.until&&key>b.until)return null}
  else if(b.date.slice(0,7)!==key)return null;
  if(b.skip&&b.skip[key])return null;
  var ov=(b.ov&&b.ov[key])||null,A=(ov&&ov.amount!=null)?ov.amount:b.amount;
  var paid=!!(b.paid&&b.paid[key]),part=(b.part&&b.part[key])||0,carry=0,dp=depth||0;
  if(b.rec&&dp<24){
    var po=occ(b,prevKey(key),dp+1);
    if(po&&!po.paid){
      if(po.part>0)carry=po.A+po.carry-po.part;else if(po.carry>0)carry=po.carry;
      if(carry<0)carry=0;
    }
  }
  return {A:A,part:part,paid:paid,carry:carry,total:A+carry,rest:paid?0:Math.max(0,A+carry-part)};
}
function dueOf(b,key){
  if(!b.rec)return b.date;
  var ov=(b.ov&&b.ov[key])||null,day=(ov&&ov.day)||pd(b.date).getDate(),dn=daysIn({y:+key.slice(0,4),m:+key.slice(5,7)-1});
  return key+"-"+pad(Math.min(day,dn));
}
function effOf(b,key){return Object.assign({},b,(b.ov&&b.ov[key])||{})}
function billsFor(mi){
  var out=[],key=mk(mi.y,mi.m);
  S.bills.forEach(function(b){
    var o=occ(b,key);if(!o)return;
    out.push({b:effOf(b,key),due:dueOf(b,key),key:key,paid:o.paid,part:o.part,carry:o.carry,total:o.total,rest:o.rest,A:o.A});
  });
  out.sort(function(a,b){return a.due<b.due?-1:1});
  return out;
}
function prevKey(k){var y=+k.slice(0,4),m=+k.slice(5,7)-2;if(m<0){m=11;y--}return mk(y,m)}
function sumBy(list,type){var t=0;list.forEach(function(x){if(x.type===type)t+=x.amount});return t}
function groupBy(list,f){var m={};list.forEach(function(x){if(x.type==="out"){var k=f(x);m[k]=(m[k]||0)+x.amount}});return m}
function dayLabel(s){
  var d=pd(s),diff=Math.round((today-d)/864e5);
  if(diff===0)return "hoje";if(diff===1)return "ontem";if(diff===-1)return "amanhã";
  return DIAS[d.getDay()]+", "+d.getDate()+" de "+MCURTO[d.getMonth()];
}
function shortDate(s){
  var diff=Math.round((today-pd(s))/864e5);
  if(diff===0)return "Hoje";if(diff===1)return "Ontem";if(diff===-1)return "Amanhã";
  var d=pd(s);return d.getDate()+" "+MCURTO[d.getMonth()];
}
function dueInfo(due,paid,part){
  if(paid)return {t:"Paga",c:"ok"};
  if(part>0)return {t:"Paga em parte",c:"warn"};
  var diff=Math.round((pd(due)-today)/864e5),dd=pd(due).getDate();
  if(diff<0)return {t:"Atrasada",c:"danger"};
  if(diff===0)return {t:"Vence hoje",c:"warn"};
  if(diff<=3)return {t:"Vence em "+diff+(diff===1?" dia":" dias"),c:"warn"};
  return {t:"Vence dia "+dd,c:""};
}
/* o coração do app: o que tenho, o que gastei e o que sobrou (passa para o mês seguinte) */
function firstYm(){var f=null;S.tx.forEach(function(t){var v=ym(pd(t.date));if(f===null||v<f)f=v});return f}
function pendOf(mi){var t=0;billsFor(mi).forEach(function(x){t+=x.rest});return t}
function carryIn(mi){
  var f=firstYm(),v=mi.y*12+mi.m,c=0,now=ym(today);
  if(f===null||v<=f)return 0;
  for(var k=f;k<v;k++){
    var mm={y:Math.floor(k/12),m:k%12},l=monthTx(mm);
    c+=sumBy(l,"in")-sumBy(l,"out");
    if(k>=now)c-=pendOf(mm);
  }
  return c;
}
function ledger(mi){
  var l=monthTx(mi),inc=sumBy(l,"in"),out=sumBy(l,"out"),car=carryIn(mi);
  return {list:l,inc:inc,out:out,carry:car,net:inc-out,avail:car+inc-out,pend:pendOf(mi)};
}
function upcoming(){
  var lim=iso(addDays(today,14)),out=[];
  [nowMi(),{y:addDays(new Date(today.getFullYear(),today.getMonth(),1),32).getFullYear(),m:addDays(new Date(today.getFullYear(),today.getMonth(),1),32).getMonth()}].forEach(function(mi){
    billsFor(mi).forEach(function(x){if(!x.paid&&x.due<=lim)out.push(x)});
  });
  return out.sort(function(a,b){return a.due<b.due?-1:1}).slice(0,10);
}

/* ---------- telas ---------- */
function render(){
  var chat=ui.tab==="chat",mi=cur(),h=new Date().getHours();
  $("greet").textContent=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  $("mpill").hidden=chat;
  $("dpill").hidden=true;
  $("dpill").textContent=DIAS[today.getDay()]+", "+today.getDate()+" "+MCURTO[today.getMonth()];
  $("fab").hidden=chat;$("cbar").hidden=!chat;
  $("mlabel").textContent=MESES[mi.m]+(mi.y!==today.getFullYear()?" "+mi.y:"");
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.tab===ui.tab)});
  $("view").innerHTML=ui.tab==="home"?vHome():ui.tab==="month"?vMonth(mi):ui.tab==="rep"?vRep(mi):vChat();
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    document.querySelectorAll("[data-off]").forEach(function(el){el.style.strokeDashoffset=el.dataset.off});
    if(ui.anim){document.querySelectorAll("[data-count]").forEach(countUp)}ui.anim=false;
  })});
  if(chat)window.scrollTo(0,document.body.scrollHeight);
}
function countUp(el){
  var to=+el.dataset.count,t0=performance.now();
  (function f(t){var k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=money(to*e);if(k<1)requestAnimationFrame(f)})(t0);
}
function jarSvg(pct){
  var y=114-Math.max(0,Math.min(1,pct))*84;
  return '<svg viewBox="0 0 100 124"><defs><clipPath id="jc"><path d="M24 24h52v6c10 6 14 16 14 30v44c0 10-8 16-18 16H28c-10 0-18-6-18-16V60c0-14 4-24 14-30z"/></clipPath></defs>'+
   '<g clip-path="url(#jc)"><rect width="100" height="124" fill="var(--surface2)"/><g transform="translate(0,'+y.toFixed(1)+')"><g class="wv"><path d="M-50 0q12.5-9 25 0t25 0 25 0 25 0 25 0 25 0 25 0 25 0V130H-50z" fill="var(--peach)"/></g></g></g>'+
   '<path d="M24 24h52v6c10 6 14 16 14 30v44c0 10-8 16-18 16H28c-10 0-18-6-18-16V60c0-14 4-24 14-30z" fill="none" stroke="var(--plum)" stroke-width="3.5" stroke-linejoin="round"/>'+
   '<rect x="20" y="10" width="60" height="13" rx="6" fill="var(--plum)"/></svg>';
}
function sgn(v){return (v<0?"− ":"+ ")+money(Math.abs(v))}
function vHome(){
  var mi=cur(),L=ledger(mi),G=S.goal.save||0;
  var empty=!L.inc&&!L.out&&!L.carry;
  var hero='<div class="card hero" id="hero"><div class="lbl">Disponível em '+MESES[mi.m]+'</div><div class="big num" data-count="'+L.avail.toFixed(2)+'">'+money(L.avail)+'</div>'+

function ctxText(){
  var cm=nowMi(),pv=new Date(cm.y,cm.m-1,1),nx=new Date(cm.y,cm.m+1,1),L=[],lg=ledger(cm);

  [cm,{y:pv.getFullYear(),m:pv.getMonth()}].forEach(function(mi){
    var s=summ(mi);
    L.push("Mês "+mk(mi.y,mi.m)+": entradas "+s.inc.toFixed(2)+", gastos "+s.out.toFixed(2)+", saldo "+(s.inc-s.out).toFixed(2)+".");
    L.push("  Gastos por categoria: "+(Object.keys(s.cats).map(function(k){return find(CATS,k).n+" "+s.cats[k].toFixed(2)}).join("; ")||"nenhum"));
    L.push("  Gastos por pagamento: "+(Object.keys(s.pays).map(function(k){return find(PAYS,k).n+" "+s.pays[k].toFixed(2)}).join("; ")||"nenhum"));
  });
  L.push("Meta de guardar por mês: "+(S.goal.save||"não definida"));
  [cm,{y:nx.getFullYear(),m:nx.getMonth()}].forEach(function(mi){
    L.push("Contas de "+mk(mi.y,mi.m)+": "+(billsFor(mi).map(function(x){return x.b.name+" R$"+x.total.toFixed(2)+(x.part>0?" (pago R$"+x.part.toFixed(2)+", resta R$"+x.rest.toFixed(2)+")":"")+(x.carry>0?" (inclui R$"+x.carry.toFixed(2)+" restantes do mês anterior)":"")+" vence "+x.due+" "+(x.paid?"PAGA":(x.due<TODAY?"ATRASADA":"PENDENTE"))}).join("; ")||"nenhuma"));
  });
  var rec=monthTx(cm).concat(monthTx({y:pv.getFullYear(),m:pv.getMonth()})).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,40);
  L.push("Últimas movimentações (data | tipo | valor | descrição | categoria | pagamento):");
  rec.forEach(function(t){L.push(t.date+" | "+(t.type==="in"?"entrada":"gasto")+" | "+t.amount.toFixed(2)+" | "+(t.desc||"")+" | "+(t.type==="in"?(t.kind==="salario"?"salário":"extra"):find(CATS,t.cat).n)+" | "+(t.type==="in"?"-":find(PAYS,t.pay||"outro").n))});

function localAnswer(q){
  q=q.toLowerCase();var lg=ledger(nowMi()),s=summ(nowMi());
  if(/passado|anterior|trouxe/.test(q))return "Do mês passado sobraram "+money(lg.carry)+", que já entram no valor disponível deste mês.";
  if(/pend|conta|pagar|vence|atras/.test(q)){
    var o=billsFor(nowMi()).filter(function(x){return !x.paid});
    return o.length?"Contas pendentes:\n"+o.map(function(x){return "• "+x.b.name+" — "+money(x.rest)+(x.part>0?" restantes":"")+" ("+dueInfo(x.due,false).t.toLowerCase()+")"}).join("\n"):"Nenhuma conta pendente neste mês.";
  }
  if(/guard|meta|cofrinho/.test(q))return S.goal.save?"Meta: guardar "+money(S.goal.save)+". O saldo do mês está em "+money(s.inc-s.out)+".":"Você ainda não definiu uma meta de guardar.";
  if(/onde|categoria|mais/.test(q)){var k=Object.keys(s.cats).sort(function(a,b){return s.cats[b]-s.cats[a]})[0];return k?"A categoria que mais pesou foi "+find(CATS,k).n+": "+money(s.cats[k])+".":"Ainda não há gastos neste mês."}
  if(/dispon|saldo|sobr|tenho/.test(q))return "Disponível agora: "+money(lg.avail)+" ("+money(lg.carry)+" do mês passado + "+money(lg.inc)+" de entradas - "+money(lg.out)+" de gastos).";
  if(/gast/.test(q))return "Neste mês você gastou "+money(s.out)+".";
  return "Não consegui usar a IA agora. Tente: quanto tenho disponível, quanto gastei ou se há contas pendentes.";
}
async function ask(q){

  var ans="";
  try{
    var sample=window.claude&&claude.use?await claude.use("sample"):null;
    if(!sample)throw 0;
    var hist=ui.chat.slice(0,-2).slice(-7).map(function(m){return (m.r==="u"?"Usuário: ":"Assistente: ")+m.t}).join("\n");
    var prompt="Você é o assistente do app Controle Total, de finanças pessoais. Responda em português do Brasil, de forma curta e direta (no máximo 4 linhas), usando SOMENTE os dados abaixo. Valores em R$. Se faltar dado, diga que não tem essa informação. Não invente.\n\nDADOS:\n"+ctxText()+"\n\nCONVERSA ATÉ AGORA:\n"+hist+"\n\nPergunta do usuário: "+q;
    var r=await Promise.race([sample(prompt,{cache:false}),new Promise(function(_,rej){setTimeout(function(){rej(new Error("t"))},25000)})]);
    ans=(r&&r.text||"").trim();

      page.drawRectangle({x:M+120,y:y+1,width:220,height:6,color:hx(LINE)});page.drawRectangle({x:M+120,y:y+1,width:Math.max(1,220*pc),height:6,color:hx(PLUM)});
      t(Math.round(pc*100)+"%",M+350,9,{c:MUT});t(money(v),M+CW,10,{r:true,b:true});
    });
  }
  if(!d.isW){
    var bl=billsFor(d.mi);
    if(bl.length){
      sec("Contas do mês");
      bl.forEach(function(x){
        need(20);y-=17;var di=dueInfo(x.due,x.paid);
        t(x.b.name,M,10,{w:230});t("dia "+pd(x.due).getDate(),M+250,9,{c:MUT});t(di.t,M+310,9,{c:x.paid?OK:(di.c==="danger"?"#D6475F":MUT),b:x.paid||di.c==="danger"});t(money(x.paid?x.total:(x.part>0||x.carry>0?x.rest:x.b.amount)),M+CW,10,{r:true,b:true});
      });
    }
  }
  sec("Movimentações do período");
  var rows=d.list.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)});
  function head(){y-=14;page.drawRectangle({x:M,y:y-5,width:CW,height:17,color:hx(PLUM)});
    t("Data",M+6,8.5,{b:true,c:"#FFF6F1"});t("Descrição",M+58,8.5,{b:true,c:"#FFF6F1"});t("Categoria",M+258,8.5,{b:true,c:"#FFF6F1"});t("Pagamento",M+360,8.5,{b:true,c:"#FFF6F1"});t("Valor",M+CW-6,8.5,{r:true,b:true,c:"#FFF6F1"});y-=6}
  if(!rows.length){y-=16;t("Nenhuma movimentação neste período.",M,10,{c:MUT})}
  else{
    need(60);head();
    rows.forEach(function(r,i){
      if(y-18<M+16){np();head()}
      y-=17;var isIn=r.type==="in";
      if(i%2===0)page.drawRectangle({x:M,y:y-5,width:CW,height:17,color:hx("#FBF4F0")});
      var dd=pd(r.date);
      t(pad(dd.getDate())+"/"+pad(dd.getMonth()+1),M+6,9,{});
      t(r.desc||(isIn?(r.kind==="salario"?"Salário":"Ganho extra"):find(CATS,r.cat).n),M+58,9,{w:190});
      t(isIn?(r.kind==="salario"?"Salário fixo":"Ganho extra"):find(CATS,r.cat).n,M+258,9,{w:95,c:MUT});
      t(isIn?"-":find(PAYS,r.pay||"outro").n,M+360,9,{w:80,c:MUT});
      t((isIn?"+ ":"- ")+money(r.amount),M+CW-6,9,{r:true,b:true,c:isIn?OK:INK});
    });
  }
  pages.forEach(function(pg,i){pg.drawText(pdfClean("Controle Total  ·  página "+(i+1)+" de "+pages.length),{x:M,y:22,size:8,font:F,color:hx(MUT)})});
  return {bytes:await doc.save(),name:"controle-total-"+d.tag+".pdf"};
}
async function savePdf(){
  if(!window.PDFLib){toast("Não consegui carregar o gerador de PDF");return}
  var r;try{r=await buildPdf()}catch(e){toast("Erro ao gerar o PDF");return}
  var dl=null;try{if(window.claude&&claude.use)dl=await claude.use("downloads")}catch(e){}
  if(dl){
    try{await dl.save({filename:r.name,data:r.bytes});toast("PDF salvo")}
    catch(e){if(!e||e.code!=="declined")toast("Não foi possível salvar o PDF")}
    return;
  }
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.bytes],{type:"application/pdf"}));a.download=r.name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast("PDF baixado");
}

/* ---------- eventos ---------- */
function goMonth(y,m){ui.y=y;ui.m=m;ui.wk=null;ui.filter="all";ui.sel=(y===today.getFullYear()&&m===today.getMonth())?TODAY:mk(y,m)+"-01"}
document.addEventListener("click",function(ev){
  if(ev.target.id==="scrim"){closeSheet();return}
  var t=ev.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;if(ui.tab==="home")ui.anim=true;render();window.scrollTo(0,ui.tab==="chat"?document.body.scrollHeight:0);return}
  var a=t.dataset.act,k=t.dataset.k;
  if(a==="mpick"){ui.py=ui.y;sheetMonth()}
  else if(a==="yprev"){ui.py--;sheetMonth()}
  else if(a==="ynext"){ui.py++;sheetMonth()}
  else if(a==="mset"){goMonth(ui.py,+k);closeSheet();render()}
  else if(a==="mtoday"){goMonth(today.getFullYear(),today.getMonth());closeSheet();render()}
  else if(a==="filter"){ui.filter=k;render()}
  else if(a==="selday"){ui.sel=k;render()}
  else if(a==="add"){openAdd({mode:t.dataset.mode,date:t.dataset.date||(ui.tab==="month"?ui.sel:defDate())})}
  else if(a==="edit"){
    var e=S.tx.filter(function(x){return x.id===t.dataset.id})[0];
    if(e){var lb=e.billId&&S.bills.filter(function(x){return x.id===e.billId})[0];if(lb)openAdd({bill:lb,key:e.bm});else openAdd({tx:e})}
  }
  else if(a==="bedit"){var b=S.bills.filter(function(x){return x.id===t.dataset.id})[0];if(b)openAdd({bill:b,key:t.dataset.key})}
  else if(a==="kmode"){sync();K.mode=k;if(k==="bill"){K.cat="contas";K.rec=true}else if(k==="in")K.rec=K.kind==="salario";else if(K.cat==="contas")K.cat=last.cat;drawAdd()}
  else if(a==="kcat"){sync();K.cat=k;drawAdd()}
  else if(a==="kkind"){sync();K.kind=k;K.rec=k==="salario";drawAdd()}
  else if(a==="kpaym"){sync();K.payMode=k;K.payTouched=true;drawAdd()}
  else if(a==="kcal"){sync();if(K.cal)K.cal=null;else{var cd=pd(K.date||TODAY);K.cal={y:cd.getFullYear(),m:cd.getMonth()}}drawAdd()}
  else if(a==="kcalnav"){sync();var nm=K.cal.m+(+k);K.cal={y:K.cal.y+Math.floor(nm/12),m:((nm%12)+12)%12};drawAdd()}
  else if(a==="kday"){sync();K.date=k;K.cal=null;drawAdd()}
  else if(a==="kscope"){sync();K.scope=k;drawAdd()}
  else if(a==="kdelone"||a==="kdelfwd"){
    var mn1=MESES[+(K.key||mk(ui.y,ui.m)).slice(5,7)-1],okRm=true;
    try{if(!K.key)K.key=mk(ui.y,ui.m);removeBill(a==="kdelone"?"one":"fwd");persist()}catch(er){okRm=false;try{persist()}catch(e2){}}
    closeSheet();ui.anim=true;try{render()}catch(e3){}
    toast(okRm?(a==="kdelone"?"Removida só de "+mn1:"Removida de "+mn1+" em diante"):"Não consegui remover. Tente de novo");
  }
  else if(a==="kfix"){sync();K.fix=k==="1";drawAdd()}
  else if(a==="krecent"){var r=recents()[+k];if(r){sync();K.cents=String(Math.round(r.amount*100));K.cat=r.cat;K.pay=r.pay||K.pay;K.desc=r.desc;drawAdd()}}
  else if(a==="kpay"){sync();K.pay=k;drawAdd()}
  else if(a==="krec"){sync();K.rec=k==="1";drawAdd()}
  else if(a==="key")pressKey(k);
  else if(a==="ksave")saveAdd();
  else if(a==="kdel"){
    if(K.edit==="bill"){removeBill("fwd")}
    else{
      var tx=S.tx.filter(function(x){return x.id===K.id})[0];
      if(tx&&tx.billId){var bb=S.bills.filter(function(x){return x.id===tx.billId})[0];if(bb&&bb.paid)delete bb.paid[tx.bm]}
      S.tx=S.tx.filter(function(x){return x.id!==K.id});
    }
    persist();closeSheet();ui.anim=true;render();toast("Excluído");
  }
  else if(a==="pay"){
    var bl=S.bills.filter(function(x){return x.id===t.dataset.id})[0];if(!bl)return;
    var key=t.dataset.key,due=t.dataset.due;bl.paid=bl.paid||{};var ef2=Object.assign({},bl,(bl.ov||{})[key]);
    if(bl.paid[key]||(bl.part&&bl.part[key])){
      delete bl.paid[key];if(bl.part)delete bl.part[key];
      S.tx=S.tx.filter(function(x){return !(x.billId===bl.id&&x.bm===key)});toast("Pagamento desfeito");
    }else{
      var o2=occ(bl,key),inM=today.getFullYear()===+key.slice(0,4)&&today.getMonth()===+key.slice(5,7)-1;
      bl.paid[key]=true;
      S.tx.push({id:uid(),ts:Date.now(),type:"out",amount:o2?(o2.rest>0?o2.rest:o2.total):ef2.amount,desc:ef2.name,cat:ef2.cat||"contas",pay:ef2.pay||"pix",date:inM?TODAY:due,billId:bl.id,bm:key});
      toast("Conta paga e anotada nos gastos");
    }
    persist();render();
  }
  else if(a==="goal")sheetGoal();
  else if(a==="gsave"){var g=parseAmount($("gVal").value);if(isNaN(g)){toast("Digite um valor");return}S.goal.save=g;persist();closeSheet();ui.anim=true;render();toast("Meta salva")}
  else if(a==="gdel"){S.goal.save=0;persist();closeSheet();render()}
  else if(a==="rmode"){ui.rep=k;render()}
  else if(a==="wk"){ui.wk=k;render()}
  else if(a==="pdf")savePdf();
  else if(a==="ask")ask(k);
  else if(a==="send"){var i=$("cIn"),q=i.value;i.value="";ask(q)}
});
document.addEventListener("change",function(e){
  if(e.target.id==="kDate"&&e.target.value){sync();K.date=e.target.value;var s=shortDate(K.date);$("kDateLbl").textContent=(K.mode==="bill"?"Vence ":"")+(K.mode==="bill"?s.toLowerCase():s)}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeSheet();
  if(e.key==="Enter"&&e.target.id==="cIn"){var q=e.target.value;e.target.value="";ask(q)}
  if(sheetOpen&&ui.adding){
    var tg=e.target.tagName;
    if((e.key==="Enter")&&(e.target.id==="kDesc"||e.target.id==="kName"||tg!=="INPUT")){e.preventDefault();saveAdd();return}
    if(tg!=="INPUT"&&!e.ctrlKey&&!e.metaKey){
      if(/^[0-9]$/.test(e.key)){pressKey(e.key)}
      else if(e.key==="Backspace"){e.preventDefault();pressKey("⌫")}
    }
  }
});

render();
boot().then(function(){ui.anim=true;render();hideSplash()},function(){render();hideSplash()});
